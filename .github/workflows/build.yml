name: Android CI — Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      export_apk:
        description: "Transferir APK de teste via API Git para ambientes sem acesso aos artifacts"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" > /dev/null

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify Gradle / Kotlin toolchain
        run: ./gradlew --version --no-daemon

      # Compiles every Kotlin source file, the Compose resources and the launcher icons.
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee build-tests.log

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the screens on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -o pipefail -c 'adb shell wm size 1376x768; adb shell wm density 160; adb shell settings put secure immersive_mode_confirmations confirmed; ./gradlew connectedDebugAndroidTest --no-daemon 2>&1 | tee build-instrumented.log; result=${PIPESTATUS[0]}; mkdir -p artifacts; if [ "$result" -ne 0 ]; then adb exec-out cat /data/local/tmp/iptv-ui-failure.png > artifacts/screen-failure.png 2>/dev/null || true; adb exec-out cat /data/local/tmp/iptv-ui-failure.txt > artifacts/diagnostics.txt 2>/dev/null || true; if [ ! -s artifacts/screen-failure.png ]; then adb exec-out screencap -p > artifacts/screen-failure.png || true; fi; else for name in login home hero-poster movies series live favorites settings player multi phone phone-home phone-tv; do adb exec-out cat /data/local/tmp/iptv-screen-$name.png > artifacts/screen-$name.png || result=1; done; fi; exit "$result"'

      - name: Exercise D-pad and overscan on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash -o pipefail -c './gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.iptv.ScreenIntegrationTest#largeScreenRemoteNavigationAndOverscanAreUsable -Pandroid.testInstrumentationRunnerArguments.requireTv=true --no-daemon 2>&1 | tee build-tv.log; result=${PIPESTATUS[0]}; if [ "$result" -eq 0 ]; then adb exec-out cat /data/local/tmp/iptv-screen-android-tv.png > artifacts/screen-android-tv.png || result=1; else adb exec-out cat /data/local/tmp/iptv-ui-failure.png > artifacts/screen-failure.png 2>/dev/null || true; adb exec-out cat /data/local/tmp/iptv-ui-failure.txt > artifacts/diagnostics.txt 2>/dev/null || true; fi; exit "$result"'

      # Same signing config as debug (see app/build.gradle.kts), so the artifact is installable
      # straight from the Actions run.
      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IPTV-Native-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IPTV-Native-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Optional transport for restricted environments that cannot reach Actions artifact storage.
      # Git blobs are unreferenced; APKs are never committed to the source tree.
      - name: Export APK through Git data API
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.export_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[export-apk]')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess
          apk = next(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          data = apk.read_bytes()
          repo = os.environ['GITHUB_REPOSITORY']
          shas = []
          for offset in range(0, len(data), 2 * 1024 * 1024):
              chunk = data[offset:offset + 2 * 1024 * 1024]
              payload = json.dumps({'content': base64.b64encode(chunk).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', f'repos/{repo}/git/blobs', '--method', 'POST',
                                       '--input', '-', '--jq', '.sha'], input=payload, text=True,
                                      capture_output=True, check=True)
              shas.append(result.stdout.strip())
          screenshots = []
          for name in ('screen-login.png', 'screen-home.png', 'screen-movies.png', 'screen-series.png', 'screen-live.png', 'screen-favorites.png', 'screen-settings.png', 'screen-player.png', 'screen-multi.png', 'screen-phone.png', 'screen-phone-home.png', 'screen-phone-tv.png', 'screen-hero-poster.png', 'screen-android-tv.png'):
              path = pathlib.Path('artifacts') / name
              if path.exists() and path.stat().st_size:
                  payload = json.dumps({'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})
                  result = subprocess.run(['gh', 'api', f'repos/{repo}/git/blobs', '--method', 'POST',
                                           '--input', '-', '--jq', '.sha'], input=payload, text=True,
                                          capture_output=True, check=True)
                  screenshots.append(name + '=' + result.stdout.strip())
          comment = ('APK_BLOB_TRANSFER_V1\nrun=' + os.environ['GITHUB_RUN_ID'] +
                     '\nsha256=' + hashlib.sha256(data).hexdigest() + '\nsize=' + str(len(data)) +
                     '\nblobs=' + ','.join(shas) + '\n' + '\n'.join(screenshots))
          subprocess.run(['gh', 'api', f"repos/{repo}/commits/{os.environ['GITHUB_SHA']}/comments",
                          '--method', 'POST', '-f', 'body=' + comment], check=True)
          PYCODE

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-debug.log
            build-tests.log
            build-instrumented.log
            build-tv.log
            build-release.log
            app/build/reports/**
            **/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      # Makes the compiler output readable from the outside even when the Actions log API
      # is not reachable (the tail of the log is stored as a commit comment).
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="(build log unavailable)"
          for FILE in build-tv.log build-instrumented.log build-release.log build-tests.log build-debug.log; do
            if [ -f "$FILE" ]; then
              LOG=$( { grep -E '(^e: | error: |^FAILURE:|^\* What went wrong:|^> | FAILED|tests? (completed|failed))' "$FILE" || true; tail -n 90 "$FILE"; } | tail -n 160)
              break
            fi
          done
          if [ -d app/build/outputs/androidTest-results ]; then
            REPORT=$(python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
                  for case in root.iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          print(case.get('name'), failure.get('message', ''), (failure.text or '')[:8000])
              except Exception:
                  pass
          PYCODE
            )
            LOG="$LOG
          $REPORT"
          fi
          if [ -s artifacts/diagnostics.txt ]; then
            LOG="$LOG
          $(head -c 40000 artifacts/diagnostics.txt)"
          fi
          if [ -s artifacts/screen-failure.png ]; then
            SCREEN_BLOB=$(python3 - <<'PYCODE'
          import base64, json, os, subprocess
          data = open('artifacts/screen-failure.png', 'rb').read()
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
          proc = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
                                 '--method', 'POST', '--input', '-', '--jq', '.sha'], input=payload,
                                text=True, capture_output=True)
          print(proc.stdout.strip())
          PYCODE
            )
            LOG="$LOG
          SCREENSHOT_BLOB=$SCREEN_BLOB"
          fi
          jq -n --arg body "${LOG:0:60000}" '{body: $body}' > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @payload.json || true
