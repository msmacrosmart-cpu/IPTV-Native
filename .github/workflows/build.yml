name: Android CI — Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" > /dev/null

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify Gradle / Kotlin toolchain
        run: ./gradlew --version --no-daemon

      # Compiles every Kotlin source file, the Compose resources and the launcher icons.
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log

      # Same signing config as debug (see app/build.gradle.kts), so the artifact is installable
      # straight from the Actions run.
      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IPTV-Native-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IPTV-Native-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-debug.log
            build-release.log
            app/build/reports/**
            **/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      # Makes the compiler output readable from the outside even when the Actions log API
      # is not reachable (the tail of the log is stored as a commit comment).
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="(debug log unavailable)"
          if [ -f build-debug.log ]; then
            LOG=$(tail -n 160 build-debug.log)
          elif [ -f build-release.log ]; then
            LOG=$(tail -n 160 build-release.log)
          fi
          jq -n --arg body "$LOG" '{body: $body}' > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @payload.json || true
