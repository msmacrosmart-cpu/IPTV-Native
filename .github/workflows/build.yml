name: Android CI - Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect project directory & grant permissions
        run: |
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            chmod +x ./gradlew
          elif [ -f "./iptv-native-android/gradlew" ]; then
            echo "PROJECT_DIR=iptv-native-android" >> $GITHUB_ENV
            chmod +x ./iptv-native-android/gradlew
          else
            GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              DIR=$(dirname "$GRADLEW_PATH")
              echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
              chmod +x "$GRADLEW_PATH"
            else
              echo "PROJECT_DIR=." >> $GITHUB_ENV
            fi
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
