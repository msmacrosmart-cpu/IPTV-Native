name: Inspect supplied reference APK (static only)
on:
  push:
    paths: [".github/workflows/reference-audit.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect settings layouts without installing or executing the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://github.com/smartmacro77-gif/apps/releases/download/v1.0/MakroTV.XtreamYT.apk' -o /tmp/reference.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump --values resources /tmp/reference.apk > /tmp/resources.txt
          python3 - <<'PY' > /tmp/reference-audit.txt
          import re, subprocess, os, zipfile
          print('REFERENCE_APK_AUDIT_V3')
          aapt=os.environ['ANDROID_HOME']+'/build-tools/35.0.0/aapt'
          lines=open('/tmp/resources.txt',encoding='utf8',errors='replace').read().splitlines()
          ids={}
          for line in lines:
              m=re.search(r'(?:spec )?resource (0x[0-9a-f]+) brstore\.makro\.app:([a-z]+)/([^:]+):',line)
              if m: ids[m.group(1)]=m.group(2)+'/'+m.group(3)
          layouts=['activity_settings','activity_general_settings','activity_epg_settings','activity_player_selection','activity_player_settings','activity_multi_setting_new','activity_account_info','activity_profile','fragment_parental_control_setting','fragment_parental_control_categories','fragment_parental_control_vodcat']
          names=set(zipfile.ZipFile('/tmp/reference.apk').namelist())
          for name in layouts:
              path='res/layout/'+name+'.xml'
              if path not in names: continue
              print('\n=== '+name+' ===')
              output=subprocess.run([aapt,'dump','xmltree','/tmp/reference.apk',path],capture_output=True,text=True).stdout
              for line in output.splitlines():
                  if not re.search(r'android:(?:id|text|hint|entries|entryValues|visibility)',line): continue
                  for key,value in ids.items():
                      if key in line: line=line.replace(key,value)
                  print(line.strip())
          PY
          head -c 60000 /tmp/reference-audit.txt > /tmp/reference-audit-short.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --method POST -f body="$(cat /tmp/reference-audit-short.txt)"
          cat /tmp/reference-audit-short.txt
